# ==========================================================
# Agentic RAG System Configuration
# ==========================================================

paths:
  raw_data_dir: "data/raw"
  documents_dir: "documents"
  processed_data_dir: "data/processed"
  indices_dir: "data/indices"
  vector_store_dir: "data/indices/vector_store"
  bm25_index_file: "data/indices/bm25_index.json"
  results_dir: "evaluation/results"

knowledge:
  public_dir: "data/public"              # Prospect-safe content only
  internal_dirs: ["data/raw", "documents"]  # Staff/internal content
  prospect_web_search: true              # Allow curated web fallback for prospects
  prospect_gdrive: false                 # Never expose Google Drive to prospects

preprocessing:
  supported_extensions: [".txt", ".pdf", ".md", ".docx", ".html", ".htm"]
  normalize_unicode: true
  remove_extra_whitespace: true
  strip_html_tags: true
  min_chunk_length: 50

chunking:
  chunk_size: 512          # Target characters per chunk
  chunk_overlap: 64        # Boundary overlap retention
  separators: ["\n## ", "\n### ", "\n\n", "\n", ". ", "; ", " "]

models:
  embedding:
    provider: "sentence-transformers" # "sentence-transformers" | "openai" | "lightweight"
    model_name: "all-MiniLM-L6-v2"
    dimension: 384
    batch_size: 32

  reranker:
    enabled: true
    provider: "cross-encoder"        # "cross-encoder" | "lexical"
    model_name: "cross-encoder/ms-marco-MiniLM-L-6-v2"
    top_n: 3                         # Final chunks passed to the LLM

  llm:
    provider: "gemini"                 # "groq" | "gemini" | "openai" | "ollama" | "mock"
    model_name: "gemini-flash-lite-latest"  # Google AI Studio free tier model
    temperature: 0.1
    max_tokens: 1024
    timeout_seconds: 10                # Total LLM time budget per call; on expiry the Grounded Generator answers

retrieval:
  top_k_vector: 10                   # Top candidates from vector search
  top_k_bm25: 10                     # Top candidates from BM25 search
  fusion_method: "rrf"               # "rrf" (Reciprocal Rank Fusion) or "weighted"
  rrf_k: 60                          # RRF smoothing constant
  vector_weight: 0.6                 # Used if fusion_method is "weighted"
  bm25_weight: 0.4                   # Used if fusion_method is "weighted"

generation:
  strict_grounding: true             # Forbid answering if context is insufficient
  include_citations: true            # Include [Source: DocID - ChunkID] citations
  confidence_threshold: 0.0          # Minimum relevance score to consider relevant

evaluation:
  test_dataset_path: "evaluation/test_queries.json"
  metrics:
    - "hit_rate@k"
    - "mrr"
    - "faithfulness"
    - "latency"
